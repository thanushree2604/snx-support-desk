  <!-- Curve bottom right -->
  <path d="M 450 680 Q 600 650 720 500" fill="none" stroke="#22c55e" stroke-width="20" stroke-linecap="round"/>
  
  <!-- Text below -->
  <text x="400" y="750" font-size="48" font-weight="bold" text-anchor="middle" fill="#003da6" font-family="Arial, sans-serif">SUPPORT DESK</text>
  <text x="400" y="790" font-size="32" text-anchor="middle" fill="#666" font-family="Arial, sans-serif">SMART IT SERVICE MANAGEMENT PLATFORM</text>
